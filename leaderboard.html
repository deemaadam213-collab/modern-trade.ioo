<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المتصدرين | ECUMT 3-01</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ecumt-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="index.html">
      <svg class="brand__mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="4" y="4" width="36" height="36" rx="10" class="mark-bg"/>
        <path d="M13 27 L22 13 L31 27 Z" class="mark-shape"/>
        <rect x="19.5" y="23" width="5" height="8" rx="1" class="mark-dot"/>
      </svg>
      <span class="brand__text">
        <strong>المفاهيم الأساسية لبيئة التجارة الحديثة</strong>
        <small>ECUMT 3-01</small>
      </span>
    </a>
    <nav class="nav" aria-label="main">
      <a class="nav__link" href="index.html">النواتج</a>
      <a class="nav__link" href="index.html#video">الفيديو</a>
      <a class="nav__link" href="exams.html">الامتحانات</a>
      <a class="nav__link is-active" href="leaderboard.html">المتصدرين</a>
    </nav>
    <div class="actions">
      <button id="themeBtn" class="iconbtn" type="button" aria-label="تبديل المظهر">
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="pagehead">
    <div class="pagehead__inner">
      <span class="kicker">LEADERBOARD</span>
      <h1>قايمة المتصدرين</h1>
      <p>النتائج المحفوظة على هذا الجهاز والمتصفح فقط. مش بتظهر على أجهزة الطلاب التانيين أو عند المعلم.</p>
    </div>
  </section>

  <div class="content">
    <div class="block">
      <div class="tabs" role="group" aria-label="الأسبوع">
        <button type="button" class="btn btn--ghost is-active" data-week="0" aria-pressed="true">الأسبوع ده</button>
        <button type="button" class="btn btn--ghost" data-week="1" aria-pressed="false">الأسبوع اللي فات</button>
      </div>
      <div id="meCard"></div>
      <ol class="lb" id="board"></ol>
    </div>

    <div class="block">
      <h2 class="block__title">محاولاتي على هذا الجهاز</h2>
      <ul class="att" id="attempts"></ul>
    </div>
  </div>
</main>

<footer class="footer">
  <p class="footer__made">صُنع بواسطة <span class="footer__name">آدم محمد</span></p>
  <p class="footer__super">تحت إشراف ميس نرمين</p>
</footer>
<script src="auth.js"></script>
<script src="leaderboard.js"></script>
<script src="app.js"></script>
</body>
</html>
