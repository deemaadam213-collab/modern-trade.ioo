<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تغيير كلمة المرور — ECUMT 3-01</title>
  <script>
    try { const t = localStorage.getItem("ecumt-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar"><div class="topbar__inner">
    <a class="brand" href="index.html"><span class="brand__text"><strong>المفاهيم الأساسية للتجارة</strong><small>ECUMT 3-01</small></span></a>
    <nav class="nav" aria-label="التنقل"><a class="nav__link" href="index.html">النواتج</a><a class="nav__link" href="quiz.html">التقييم الذاتي</a></nav>
    <div class="actions"><button id="themeBtn" class="iconbtn" type="button" aria-label="تغيير المظهر">◐</button><a class="nav__link" href="login.html">دخول</a></div>
  </div></header>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="kicker">مساحة الطالب</span>
      <h1 id="auth-title">اختيار كلمة مرور جديدة</h1>
      <p class="auth-intro">أدخل كلمة المرور الجديدة لحسابك.</p>
      <form data-password-update novalidate>
        <label class="auth-field">كلمة المرور الجديدة<input name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
        <label class="auth-field">تأكيد كلمة المرور<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required /></label>
        <p class="auth-message" data-auth-message role="status" aria-live="polite" hidden></p>
        <button class="btn btn--primary auth-submit" type="submit">حفظ كلمة المرور</button>
      </form>
    </section>
  </main>
  <script type="module" src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
