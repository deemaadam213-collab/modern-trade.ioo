<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول — ECUMT 3-01</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ecumt-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<script>
try {
  if (sessionStorage.getItem("ecumt-login") === "1") location.replace("index.html");
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">
      <svg class="brand__mark" viewBox="0 0 44 44" width="52" height="52" aria-hidden="true">
        <rect x="4" y="4" width="36" height="36" rx="10" class="mark-bg"/>
        <path d="M13 27 L22 13 L31 27 Z" class="mark-shape"/>
        <rect x="19.5" y="23" width="5" height="8" rx="1" class="mark-dot"/>
      </svg>
    </div>
    <h1>تسجيل الدخول</h1>
    <p class="auth-intro">الملخص الدراسي لوحدة ECUMT 3-01 — ادخل باليوزرنيم والباسورد بتاعك.</p>

    <p class="auth-message" id="loginError" hidden></p>

    <form id="loginForm" novalidate>
      <label class="auth-field">
        اسم المستخدم
        <input type="text" id="loginUser" autocomplete="username" required />
      </label>
      <label class="auth-field">
        الباسورد
        <input type="password" id="loginPass" autocomplete="current-password" required />
      </label>
      <button class="btn btn--primary auth-submit" type="submit">دخول</button>
    </form>

    <p class="auth-switch">مش عندك حساب؟ <a href="signup.html">اعمل حساب جديد</a></p>
  </div>
</main>

<script>
(function () {
  "use strict";

  var form = document.getElementById("loginForm");
  var error = document.getElementById("loginError");

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem("ecumt-users") || "{}"); }
    catch (e) { return {}; }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("loginUser").value.trim();
    var p = document.getElementById("loginPass").value;

    var users = loadUsers();
    var record = users[u.toLowerCase()];

    if (record && record.password === p) {
      try { sessionStorage.setItem("ecumt-login", "1"); } catch (err) {}
      location.href = "index.html";
    } else {
      if (Object.keys(users).length === 0) {
        error.textContent = "مفيش حسابات لسه — اعمل حساب جديد الأول.";
      } else {
        error.textContent = "اليوزرنيم أو الباسورد غلط، حاول تاني.";
      }
      error.hidden = false;
      form.reset();
      document.getElementById("loginUser").focus();
    }
  });
})();
</script>

</body>
</html>
