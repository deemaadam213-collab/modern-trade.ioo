<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حساب جديد — ECUMT 3-01</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ecumt-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<script>
try {
  if (sessionStorage.getItem("ecumt-login") === "1") location.replace("index.html");
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">
      <svg class="brand__mark" viewBox="0 0 44 44" width="52" height="52" aria-hidden="true">
        <rect x="4" y="4" width="36" height="36" rx="10" class="mark-bg"/>
        <path d="M13 27 L22 13 L31 27 Z" class="mark-shape"/>
        <rect x="19.5" y="23" width="5" height="8" rx="1" class="mark-dot"/>
      </svg>
    </div>
    <h1>حساب جديد</h1>
    <p class="auth-intro">اعمل يوزرنيم وباسورد خاصين بيك عشان تدخل على الملخص.</p>

    <p class="auth-message" id="signupError" hidden></p>

    <form id="signupForm" novalidate>
      <label class="auth-field">
        اسم المستخدم
        <input type="text" id="signupUser" autocomplete="username" required />
      </label>
      <label class="auth-field">
        الباسورد
        <input type="password" id="signupPass" autocomplete="new-password" required />
      </label>
      <label class="auth-field">
        تأكيد الباسورد
        <input type="password" id="signupPass2" autocomplete="new-password" required />
      </label>
      <button class="btn btn--primary auth-submit" type="submit">اعمل الحساب</button>
    </form>

    <p class="auth-switch">عندك حساب؟ <a href="login.html">سجل دخولك من هنا</a></p>
  </div>
</main>

<script>
(function () {
  "use strict";

  var form = document.getElementById("signupForm");
  var error = document.getElementById("signupError");

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem("ecumt-users") || "{}"); }
    catch (e) { return {}; }
  }

  function fail(msg, el) {
    error.textContent = msg;
    error.hidden = false;
    if (el) el.focus();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    error.hidden = true;

    var userEl = document.getElementById("signupUser");
    var passEl = document.getElementById("signupPass");
    var pass2El = document.getElementById("signupPass2");

    var u = userEl.value.trim();
    var p = passEl.value;
    var p2 = pass2El.value;

    if (u.length < 2) return fail("اكتب اسم مستخدم من حرفين على الأقل.", userEl);

    var users = loadUsers();
    if (Object.prototype.hasOwnProperty.call(users, u.toLowerCase())) {
      return fail("اليوزرنيم ده موجود قبل كده، اختار غيره.", userEl);
    }

    if (p.length < 4) return fail("الباسورد لازم يكون 4 حروف على الأقل.", passEl);
    if (p !== p2) return fail("الباسوردين مش متطابقين، راجعهم.", pass2El);

    users[u.toLowerCase()] = { name: u, password: p };
    try { localStorage.setItem("ecumt-users", JSON.stringify(users)); } catch (err) {}

    try { sessionStorage.setItem("ecumt-login", "1"); } catch (err) {}
    location.href = "index.html";
  });
})();
</script>

</body>
</html>
